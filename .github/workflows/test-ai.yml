name: Test AI Interpreter

on:
  workflow_dispatch:

jobs:
  test-interpreter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run interpreter
        run: python ai/interpreter.py
